on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [ Win32 ]
        build_type: [ Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A ${{matrix.arch}} ..
          
      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c (https://github.com/libsdl-org/SDL/issues/11487 / https://github.com/actions/runner-images/issues/10980)
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{matrix.build_type}} 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "## Compiler output" >> $env:GITHUB_STEP_SUMMARY
            "The final 200 lines from the failed Windows build:" >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-output.log -Tail 200 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $errors = Get-Content build-output.log | Select-String -Pattern 'error C\d+|fatal error|LNK\d+'
            if (-not $errors) { $errors = Get-Content build-output.log -Tail 30 }
            $escaped = (($errors | Select-Object -First 30) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows compiler errors::$escaped"
            exit $buildExitCode
          }
          
      - name: Download and verify supported replacement EXE
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE -OutFile build/bin/OR2006C2C.exe
          $definitions = [regex]::Matches((Get-Content -Raw src/supported_executable.hpp), 'Sha256\s*=\s*"([0-9a-f]{64})"')
          if ($definitions.Count -ne 1) { throw 'Expected exactly one supported EXE SHA-256 definition' }
          $expectedHash = $definitions[0].Groups[1].Value
          $actualHash = (Get-FileHash -LiteralPath build/bin/OR2006C2C.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Supported replacement EXE SHA-256: $actualHash"
          if ($actualHash -ne $expectedHash) { throw "Unsupported replacement EXE hash: $actualHash" }
          "SUPPORTED_EXE_SHA256=$expectedHash" >> $env:GITHUB_ENV

      - name: Test Save Recovery on a disposable root
        shell: pwsh
        run: |
          & build/bin/save_recovery_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Experience licence clone on a disposable root
        shell: pwsh
        run: |
          & build/bin/experience_licence_test.exe build/bin/OR2006C2C.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native Unlock All safety gates offline
        shell: pwsh
        run: |
          & build/bin/native_unlock_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage production files and audit artifact
        shell: pwsh
        run: |
          $package = 'build/package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $files = @{
            'OR2006C2C.exe' = 'build/bin/OR2006C2C.exe'
            'dinput8.dll' = 'build/bin/dinput8.dll'
            'OutRun2006Tweaks.ini' = 'OutRun2006Tweaks.ini'
            'OutRun2006Tweaks.lods.ini' = 'OutRun2006Tweaks.lods.ini'
            'README.md' = 'README.md'
            'LICENSE.md' = 'LICENSE.md'
          }
          foreach ($name in $files.Keys) {
            $source = $files[$name]
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing production file: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $package $name)
          }
          $packagedExeHash = (Get-FileHash -LiteralPath (Join-Path $package 'OR2006C2C.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Packaged OR2006C2C.exe SHA-256: $packagedExeHash"
          if ($packagedExeHash -ne $env:SUPPORTED_EXE_SHA256) { throw 'Packaged replacement EXE hash differs from the supported executable' }
          $actual = @(Get-ChildItem -LiteralPath $package -Recurse -File)
          $unexpected = @($actual | Where-Object { -not $files.ContainsKey($_.Name) -or ($_.Extension -ieq '.exe' -and $_.Name -ine 'OR2006C2C.exe') })
          if ($unexpected.Count -gt 0 -or $actual.Count -ne $files.Count) {
            throw "Production package contains unexpected or missing files: $($actual.Name -join ', ')"
          }
          '## Production artifact contents' >> $env:GITHUB_STEP_SUMMARY
          "Verified OR2006C2C.exe SHA-256: $packagedExeHash" >> $env:GITHUB_STEP_SUMMARY
          foreach ($item in ($actual | Sort-Object Name)) {
            Write-Host "$($item.Name) ($($item.Length) bytes)"
            "- $($item.Name) ($($item.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          }
          
      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multi-device-controlled-test-build-${{ github.run_number }}-${{ github.sha }}
          path: build/package/

      - name: Package v0.1.0 release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Prepare v0.1.0 release'
        shell: pwsh
        run: |
          Compress-Archive -Path build/package/* -DestinationPath build/OutRun2006-Multi-Device-Input-v0.1.0.zip

      - name: Publish v0.1.0 release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Prepare v0.1.0 release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create multi-device-v0.1.0 build/OutRun2006-Multi-Device-Input-v0.1.0.zip --target "${{ github.sha }}" --title "OutRun 2006 Multi Device Input v0.1.0" --notes-file .github/release-notes/multi-device-v0.1.0.md
