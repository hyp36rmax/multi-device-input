on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [ Win32 ]
        build_type: [ Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A ${{matrix.arch}} ..
          
      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c (https://github.com/libsdl-org/SDL/issues/11487 / https://github.com/actions/runner-images/issues/10980)
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{matrix.build_type}} 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "## Compiler output" >> $env:GITHUB_STEP_SUMMARY
            "The final 200 lines from the failed Windows build:" >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-output.log -Tail 200 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $errors = Get-Content build-output.log | Select-String -Pattern 'error C\d+|fatal error|LNK\d+'
            if (-not $errors) { $errors = Get-Content build-output.log -Tail 30 }
            $escaped = (($errors | Select-Object -First 30) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows compiler errors::$escaped"
            exit $buildExitCode
          }

      - name: Verify Force Character channel isolation
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve package identity from product metadata
        id: build_identity
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          $identityTool = Get-ChildItem build -Recurse -Filter package_identity_tool.exe | Select-Object -First 1
          if (-not $identityTool) { throw "package_identity_tool.exe was not built" }
          $artifactName = (& $identityTool.FullName $shortSha).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($artifactName)) {
            throw "Could not derive package identity from ProductIdentity::ReleaseVersion"
          }
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "Multi Input package identity: $artifactName"

      - name: Stage HYP36rforce FFB development build
        shell: pwsh
        run: |
          $stage = "build/development-artifact/package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/bin/dinput8.dll" $stage
          Copy-Item "OutRun2006Tweaks.ini" $stage
          Copy-Item "OutRun2006Tweaks.lods.ini" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE.md" $stage
          Copy-Item "docs/SIMHUB.md" "$stage/SIMHUB.md"
          Copy-Item "tools/simhub/OutRun 2006 C2C Multi Input.simdef" $stage
          Invoke-WebRequest -Uri "https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE" -OutFile "$stage/OR2006C2C.exe"

      - name: Verify HYP36rforce FFB development build
        shell: pwsh
        run: |
          $stage = "build/development-artifact/package"
          $artifactName = "${{ steps.build_identity.outputs.artifact_name }}"
          $shortSha = "${{ steps.build_identity.outputs.short_sha }}"
          $identityTool = Get-ChildItem build -Recurse -Filter package_identity_tool.exe | Select-Object -First 1
          $expectedArtifactName = (& $identityTool.FullName $shortSha).Trim()
          if ($LASTEXITCODE -ne 0 -or $artifactName -cne $expectedArtifactName) {
            throw "Invalid package identity: $artifactName (expected $expectedArtifactName)"
          }
          $expectedExe = "68ceb386829066f8455b9d027320af962584321f3e2e8a79c72841495a6134c3"
          $actualExe = (Get-FileHash "$stage/OR2006C2C.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualExe -ne $expectedExe) { throw "OR2006C2C.exe hash mismatch: $actualExe" }
          $actual = @(Get-ChildItem $stage -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($stage, $_.FullName) } | Sort-Object)
          $manifestArguments = @("--manifest") + $actual
          & $identityTool.FullName $manifestArguments
          if ($LASTEXITCODE -ne 0) { throw "Unexpected development manifest: $($actual -join ', ')" }
          "Verified OR2006C2C.exe SHA-256: $actualExe" | Tee-Object -FilePath "build/development-artifact/SHA256SUMS.txt"
          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            "{0}  package/{1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Tee-Object -FilePath "build/development-artifact/PACKAGE-SHA256SUMS.txt"

      - name: Upload HYP36rforce FFB development build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build_identity.outputs.artifact_name }}
          path: build/development-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Stage SIMHUB-02A synthetic sender
        shell: pwsh
        run: |
          $stage = "build/simhub-02a-artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/bin/SimHub-OutRun2006-SyntheticSender.exe" $stage
          Copy-Item "tools/simhub/OutRun 2006 C2C Multi Input.simdef" $stage
          Copy-Item "tools/simhub/TESTING.md" $stage
          $actual = @(Get-ChildItem $stage -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @(
            "OutRun 2006 C2C Multi Input.simdef",
            "SimHub-OutRun2006-SyntheticSender.exe",
            "TESTING.md"
          ) | Sort-Object
          if (Compare-Object $actual $expected) {
            throw "Unexpected SIMHUB-02A artifact manifest: $($actual -join ', ')"
          }
          Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Tee-Object -FilePath "$stage/SHA256SUMS.txt"

      - name: Upload SIMHUB-02A synthetic sender
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SimHub-OutRun2006-SyntheticSender-${{ steps.build_identity.outputs.short_sha }}
          path: build/simhub-02a-artifact/
          if-no-files-found: error
          retention-days: 14
