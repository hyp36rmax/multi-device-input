on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [ Win32 ]
        build_type: [ Release ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A ${{matrix.arch}} ..
          
      - name: Add older VC2022 redist workaround to safetyhook
        shell: pwsh
        run: |
          (Get-Content build/_deps/safetyhook-build/src/safetyhook.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/safetyhook-build/safetyhook.vcxproj
          (Get-Content build/_deps/zydis-build/Zydis.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/Zydis.vcxproj
          (Get-Content build/_deps/zydis-build/zycore/Zycore.vcxproj) -replace 'ZYCORE_STATIC_BUILD', '_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR;ZYCORE_STATIC_BUILD' | Set-Content build/_deps/zydis-build/zycore/Zycore.vcxproj

      - name: Zero out SDL_gameinputjoystick.c (https://github.com/libsdl-org/SDL/issues/11487 / https://github.com/actions/runner-images/issues/10980)
        shell: pwsh
        run: |
          Set-Content -Path build/_deps/sdl-src/src/joystick/gdk/SDL_gameinputjoystick.c -Value ""
          (Get-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h) -replace '#define SDL_JOYSTICK_GAMEINPUT 1', '/* #undef SDL_JOYSTICK_GAMEINPUT */' | Set-Content build/_deps/sdl-build/include-config-release/build_config/SDL_build_config.h
      
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{matrix.build_type}} 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "## Compiler output" >> $env:GITHUB_STEP_SUMMARY
            "The final 200 lines from the failed Windows build:" >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-output.log -Tail 200 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $errors = Get-Content build-output.log | Select-String -Pattern 'error C\d+|fatal error|LNK\d+'
            if (-not $errors) { $errors = Get-Content build-output.log -Tail 30 }
            $escaped = (($errors | Select-Object -First 30) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows compiler errors::$escaped"
            exit $buildExitCode
          }

      - name: Verify Force Character channel isolation
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage R1 UAT package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = 'build/research-artifact'
          $package = "$artifactRoot/UAT"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'build/bin/dinput8.dll' "$package/dinput8.dll"
          Copy-Item 'OutRun2006Tweaks.ini' "$package/OutRun2006Tweaks.ini"
          Copy-Item '.github/uat/OutRun2006Tweaks.user.ini' "$package/OutRun2006Tweaks.user.ini"
          Copy-Item 'README.md' "$package/README.md"
          Copy-Item 'LICENSE.md' "$package/LICENSE.md"
          Invoke-WebRequest -Uri 'https://github.com/emoose/OutRun2006Tweaks/releases/download/v0.1/OR2006C2C.EXE' -OutFile "$package/OR2006C2C.exe"

          $expectedHash = '68ceb386829066f8455b9d027320af962584321f3e2e8a79c72841495a6134c3'
          $actualHash = (Get-FileHash "$package/OR2006C2C.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Supported OR2006C2C.exe SHA-256: $actualHash"
          if ($actualHash -ne $expectedHash) { throw 'Unsupported OR2006C2C.exe hash' }

          $expectedFiles = @('OR2006C2C.exe', 'dinput8.dll', 'OutRun2006Tweaks.ini', 'OutRun2006Tweaks.user.ini', 'README.md', 'LICENSE.md') | Sort-Object
          $actualFiles = @(Get-ChildItem $package -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object $expectedFiles $actualFiles) { throw "Unexpected package contents: $($actualFiles -join ', ')" }
          $unexpectedDirectories = @(Get-ChildItem $artifactRoot -Directory | Where-Object Name -ne 'UAT')
          if ($unexpectedDirectories) { throw "Unexpected artifact directories: $($unexpectedDirectories.Name -join ', ')" }
          Write-Host "R1 UAT package: UAT/$($actualFiles -join ', UAT/')"

      - name: Hash Research II R1 UAT contents
        shell: pwsh
        run: |
          Get-ChildItem 'build/research-artifact/UAT' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "UAT/$($_.Name) SHA-256: $hash"
            "UAT/$($_.Name) SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Research II R1 UAT build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OutRun-2006-C2C-Multi-Input-RESEARCH-II-R1-UAT
          path: build/research-artifact
          if-no-files-found: error
